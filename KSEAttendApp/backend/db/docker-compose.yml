version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: attendance_db_container
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: attendance_flask_app
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://attendance_user:password@db:5432/attendance_db
      - FLASK_SECRET_KEY=якийсь-там-випадковий-довгий-рядок
      - JWT_SECRET=super-secret-key-that-is-very-long-and-secure-32-bytes
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
